<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Suite Family — organiser la famille, en équipe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5df2"/>
      <stop offset="55%" stop-color="#5246e5"/>
      <stop offset="100%" stop-color="#1c1b3a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1040" cy="60" r="190" fill="url(#glow)"/>
    <circle cx="150" cy="330" r="150" fill="url(#glow)"/>
    <g opacity="0.16" stroke="#ffffff" stroke-width="1" fill="none">
      <path d="M760 40 C 900 40, 900 280, 1040 280"/>
      <path d="M700 300 C 860 300, 860 20, 1180 20"/>
    </g>
    <!-- app tiles (right) -->
    <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15">
      <g transform="translate(790 78)">
        <rect width="170" height="52" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
        <circle cx="26" cy="26" r="9" fill="#D31FA8"/><text x="46" y="31" fill="#ffffff">FamilyTodo</text>
      </g>
      <g transform="translate(975 78)">
        <rect width="170" height="52" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
        <circle cx="26" cy="26" r="9" fill="#2E6FD0"/><text x="46" y="31" fill="#ffffff">FamilyTrip</text>
      </g>
      <g transform="translate(790 148)">
        <rect width="170" height="52" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
        <circle cx="26" cy="26" r="9" fill="#10b981"/><text x="46" y="31" fill="#ffffff">FamilyFood</text>
      </g>
      <g transform="translate(975 148)">
        <rect width="170" height="52" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
        <circle cx="26" cy="26" r="9" fill="#8385F4"/><text x="46" y="31" fill="#ffffff">FamilyExpense</text>
      </g>
      <g transform="translate(790 218)">
        <rect width="355" height="44" rx="14" fill="#1c1b3a" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="177" y="28" fill="#e4e2f2" font-weight="600" font-size="13" text-anchor="middle">Hub · SSO · Compte famille · Communauté</text>
      </g>
    </g>
    <!-- title (left) -->
    <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <text x="64" y="96" fill="#ffffff" font-size="20" font-weight="600" letter-spacing="4" opacity="0.85">SUITE FAMILY</text>
      <text x="64" y="160" fill="#ffffff" font-size="50" font-weight="800">Et si s'organiser en famille</text>
      <text x="64" y="216" fill="#ffffff" font-size="50" font-weight="800">devenait un <tspan fill="#c9c3ff">rituel</tspan> ?</text>
      <text x="64" y="262" fill="#e4e2f2" font-size="17">Tâches · Voyages · Repas · Budget — une seule suite, toute la famille.</text>
    </g>
  </g>
</svg>
